<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La Última Puerta</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070912;color:#eef3fa;font-family:Arial,sans-serif}button{font:inherit}.hide{display:none!important}#app{height:100dvh;background:radial-gradient(ellipse at 50% 10%,#2b3b57,#111827 55%,#05060b);position:relative}.cover,.modal{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:#05070bdd}.panel{width:min(500px,100%);padding:22px;border:1px solid #cfad5d;background:linear-gradient(145deg,#1a263b,#090c16);box-shadow:0 18px 55px #000}.panel h1,.panel h2{font-family:Georgia,serif;color:#f0dfb6}.lead{font:14px/1.45 Arial;color:#cbd6e4}.btn{width:100%;padding:14px;margin-top:10px;border:1px solid #f1d38e;background:linear-gradient(135deg,#efce7b,#88612a);color:#171108;font-weight:800;letter-spacing:1px}.top{position:absolute;top:calc(6px + env(safe-area-inset-top));left:8px;right:8px;z-index:20;display:flex;justify-content:space-between}.stats,.bag{padding:7px;border:1px solid #c6a65f;background:#0c1321e8;color:#edf3fc;font-size:9px;font-weight:bold;letter-spacing:1px}.stats span{color:#e5c36d}.bag{padding:10px}.map{height:100%;padding:calc(47px + env(safe-area-inset-top)) 7px calc(7px + env(safe-area-inset-bottom));position:relative}.route{height:100%;max-width:560px;margin:auto;position:relative;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:.85fr 1.1fr 1.1fr 1.1fr 1.1fr 1.25fr;align-items:center}.lines{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}.lines path{fill:none;stroke:#957641;stroke-width:1.05;opacity:.42;vector-effect:non-scaling-stroke;stroke-linecap:round}.lines path.active{stroke:#f2cf77;stroke-width:2.1;opacity:1;filter:drop-shadow(0 0 4px #e6bd63)}.node{z-index:2;justify-self:center;width:clamp(60px,17vw,86px);min-height:52px;border:1px solid #6e7f9c77;border-radius:8px;background:#101827dc;color:#d8e2ef;text-align:center}.node:before{content:attr(data-icon);display:block;height:30px;padding-top:2px;font-size:24px}.node small{font-size:7px;letter-spacing:.5px}.node.lock{opacity:.3}.node.go{border-color:#eacb76;box-shadow:0 0 13px #d4a84d88}.pawn{position:absolute;z-index:8;left:var(--x);top:var(--y);width:46px;height:62px;margin:-31px 0 0 -23px;pointer-events:none;transition:left .8s cubic-bezier(.18,.8,.2,1),top .8s cubic-bezier(.18,.8,.2,1);filter:drop-shadow(0 5px 6px #000)}.pawn svg{display:block;width:46px;height:56px}.pawn span{display:block;margin-top:-7px;text-align:center;font:800 7px Arial;letter-spacing:1px;color:#f3dfab;text-shadow:0 2px 3px #000}.bar{height:12px;background:#07080c;border:1px solid #ffffff44}.bar i{display:block;height:100%;background:#dc6b58}</style><body><div id="app"><section id="cover" class="cover"><div class="panel"><h1>LA ÚLTIMA PUERTA</h1><p class="lead">Ronda 1. Elige una ruta desde el Umbral.</p><button id="start" class="btn">CRUZAR EL UMBRAL</button></div></section><main id="game" class="hide"></main></div><script>(()=>{'use strict';const $=x=>document.getElementById(x),nodes=[['boss',1,2,'☠','JEFE'],['a',2,1,'✧','ÉLITE'],['b',2,2,'▣','COFRE'],['c',2,3,'?','EVENTO'],['d',3,1,'⚔','COMBATE'],['e',3,2,'?','EVENTO'],['f',3,3,'▣','COFRE'],['g',4,1,'▣','COFRE'],['h',4,2,'⚔','COMBATE'],['i',4,3,'✧','ÉLITE'],['j',5,1,'⚔','COMBATE'],['k',5,2,'?','EVENTO'],['l',5,3,'⚔','COMBATE'],['start',6,2,'◉','INICIO']];let S={pos:'start',prev:'start',row:6,gold:0};const find=id=>nodes.find(n=>n[0]===id),arenSVG=()=>'<svg viewBox="0 0 100 120"><ellipse cx="50" cy="112" rx="35" ry="6" fill="#000" opacity=".5"/><path d="M29 105 39 63Q50 53 61 63l12 42z" fill="#853e3b" stroke="#261b22" stroke-width="4"/><path d="M34 58Q50 48 66 58l6 28Q50 95 28 84z" fill="#536a7b" stroke="#202b34" stroke-width="4"/><path d="M39 31Q50 20 61 31l4 23Q50 64 35 53z" fill="#c69773" stroke="#291d1b" stroke-width="3"/><path d="M34 33Q50 9 67 28v15l-10-7-16-5-7 13z" fill="#83939e" stroke="#202b34" stroke-width="4"/><path d="M71 67 94 88 89 95 66 76z" fill="#d4dde2" stroke="#263440" stroke-width="3"/><path d="M90 91 95 97 88 100 85 94z" fill="#e5c676" stroke="#4e381e" stroke-width="2"/></svg>';function can(n){if(n[0]==='start'||n[1]!==S.row-1)return false;if(n[0]==='boss')return S.row===2;let c=find(S.pos)[2];return c===1?n[2]<3:c===3?n[2]>1:true}function lines(){let r=$('route'),s=$('lines'),b=r.getBoundingClientRect();s.setAttribute('viewBox',`0 0 ${b.width} ${b.height}`);s.innerHTML='';for(let row=6;row>=2;row--)nodes.filter(a=>a[1]===row).forEach(a=>nodes.filter(z=>z[1]===row-1&&Math.abs(z[2]-a[2])<=1).forEach(z=>{let p=document.querySelector(`[data-id="${a[0]}"]`).getBoundingClientRect(),q=document.querySelector(`[data-id="${z[0]}"]`).getBoundingClientRect(),x=p.left+p.width/2-b.left,y=p.top+p.height/2-b.top,X=q.left+q.width/2-b.left,Y=q.top+q.height/2-b.top;s.insertAdjacentHTML('beforeend',`<path data-path="${a[0]}-${z[0]}" d="M ${x} ${y} Q ${(x+X)/2} ${(y+Y)/2} ${X} ${Y}"/>`)}))}function show(move=false){let h=`<section class="map"><div class="top"><div class="stats">RONDA 1/8 · AREN · NIV 1<br><span>${S.gold} oro · 0 hierro · 0 XP</span></div><button id="bag" class="bag">MOCHILA</button></div><div id="route" class="route"><svg id="lines" class="lines"></svg>`;nodes.forEach(n=>h+=`<button class="node ${can(n)?'go':'lock'}" data-id="${n[0]}" data-icon="${n[3]}" style="grid-column:${n[2]};grid-row:${n[1]}"><small>${n[4]}</small></button>`);h+='<div id="pawn" class="pawn">'+arenSVG()+'<span>AREN</span></div></div></section>';$('game').innerHTML=h;lines();let p=$('pawn'),place=id=>{let x=document.querySelector(`[data-id="${id}"]`).getBoundingClientRect(),r=$('route').getBoundingClientRect();p.style.setProperty('--x',x.left+x.width/2-r.left+'px');p.style.setProperty('--y',x.top+x.height/2-r.top+'px')};place(move?S.prev:S.pos);document.querySelectorAll('.node').forEach(b=>b.onclick=()=>{let n=find(b.dataset.id);if(!can(n))return;S.prev=S.pos;S.pos=n[0];S.row=n[1];show(true);let l=document.querySelector(`[data-path="${S.prev}-${S.pos}"]`);if(l)l.classList.add('active');setTimeout(()=>open(n),900)});$('bag').onclick=()=>popup('MOCHILA',`Oro acumulado: ${S.gold}`);if(move)requestAnimationFrame(()=>place(S.pos))}function popup(t,x){$('game').insertAdjacentHTML('beforeend',`<div class="modal"><section class="panel"><h2>${t}</h2><p class="lead">${x}</p><button id="back" class="btn">VOLVER AL MAPA</button></section></div>`);$('back').onclick=()=>show()}function open(n){if(['⚔','✧','☠'].includes(n[3]))fight(n);else{S.gold+=n[3]==='▣'?18:12;popup(n[3]==='▣'?'COFRE ABIERTO':'EVENTO DEL VELO',`Obtienes ${n[3]==='▣'?18:12} oro.`)}}function fight(n){let hp=n[3]==='☠'?90:n[3]==='✧'?58:42,max=hp;function paint(m){$('game').innerHTML=`<section class="map"><div class="modal"><section class="panel"><h2>${n[3]==='☠'?'GUARDIÁN DE OSARIO':'ENEMIGO DE CENIZA'}</h2><div style="font-size:68px;text-align:center">☠</div><div class="bar"><i style="width:${hp/max*100}%"></i></div><p class="lead">${m}</p><button id="hit" class="btn">CUCHILLADA</button><button id="out" class="btn">VOLVER AL MAPA</button></section></div></section>`;$('hit').onclick=()=>{hp-=18;hp<=0?(S.gold+=15,popup('VICTORIA','Obtienes 15 oro.')):paint(`El enemigo queda con ${hp} de vigor.`)};$('out').onclick=()=>show()}paint('El combate comienza.')}$('start').onclick=()=>{$('cover').classList.add('hide');$('game').classList.remove('hide');show()};window.addEventListener('resize',()=>!$('game').classList.contains('hide')&&show())})();</script></body></html>
